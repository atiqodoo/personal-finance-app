version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/finance_app.db:/app/finance_app.db
    environment:
      - DATABASE_URL=sqlite:///./finance_app.db
      - SECRET_KEY=your-secret-key-for-development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
